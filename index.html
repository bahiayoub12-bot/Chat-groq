<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Groq Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090f;
  --sidebar: #0b0e17;
  --surface: #0f1320;
  --surface2: #151a28;
  --surface3: #1c2235;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --accent: #5b8ef0;
  --accent-glow: rgba(91,142,240,0.25);
  --accent2: #7c6af7;
  --green: #3ecf8e;
  --red: #f87171;
  --amber: #fbbf24;
  --text: #e8ecf4;
  --text-muted: #7a85a0;
  --text-dim: #3d4560;
  --user-bubble: #1a2340;
  --ai-bubble: #0f1320;
  --sidebar-w: 280px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Tajawal', sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* ─── LAYOUT ─── */
.app {
  display: flex;
  height: 100vh;
  position: relative;
}

/* ─── SIDEBAR ─── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--sidebar);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: transform 0.3s cubic-bezier(.4,0,.2,1);
  z-index: 50;
}

.sidebar-header {
  padding: 18px 16px 12px;
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.brand-icon {
  width: 34px;
  height: 34px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  color: #fff;
  letter-spacing: -0.5px;
  flex-shrink: 0;
}

.brand-name {
  font-size: 1rem;
  font-weight: 700;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.new-chat-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  border-radius: 10px;
  padding: 10px;
  color: #fff;
  font-family: 'Tajawal', sans-serif;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
  box-shadow: 0 4px 20px var(--accent-glow);
}

.new-chat-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px var(--accent-glow); }

/* Chat history */
.history-section {
  flex: 1;
  overflow-y: auto;
  padding: 12px 8px;
}

.history-section::-webkit-scrollbar { width: 3px; }
.history-section::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.history-label {
  font-size: 0.68rem;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  padding: 4px 8px 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.history-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 2px;
  group: true;
}

.history-item:hover { background: var(--surface2); }
.history-item.active { background: var(--surface3); border: 1px solid var(--border2); }

.history-icon {
  font-size: 14px;
  opacity: 0.6;
  flex-shrink: 0;
}

.history-text {
  flex: 1;
  font-size: 0.82rem;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.history-item.active .history-text { color: var(--text); }

.history-del {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 13px;
  padding: 2px 4px;
  border-radius: 4px;
  opacity: 0;
  transition: all 0.15s;
}

.history-item:hover .history-del { opacity: 1; }
.history-del:hover { background: rgba(248,113,113,0.1); color: var(--red); }

/* Model selector in sidebar */
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}

.model-select-label {
  font-size: 0.68rem;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.model-select {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 8px 10px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s;
}

.model-select:focus { border-color: var(--accent); }
.model-select option { background: var(--surface2); }

/* ─── MAIN AREA ─── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
}

/* Top bar */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 10;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.sidebar-toggle {
  display: none;
  background: none;
  border: 1px solid var(--border2);
  border-radius: 8px;
  width: 34px;
  height: 34px;
  color: var(--text-muted);
  cursor: pointer;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.2s;
}

.sidebar-toggle:hover { background: var(--surface2); color: var(--text); }

.chat-title {
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--text);
}

.chat-subtitle {
  font-size: 0.68rem;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.status-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(62,207,142,0.08);
  border: 1px solid rgba(62,207,142,0.2);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 0.68rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--green);
}

.status-dot {
  width: 5px;
  height: 5px;
  background: var(--green);
  border-radius: 50%;
  animation: blink 2s infinite;
}

@keyframes blink {
  0%,100% { opacity:1; } 50% { opacity:0.3; }
}

.icon-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 15px;
  transition: all 0.15s;
}

.icon-btn:hover { background: var(--surface2); border-color: var(--border2); color: var(--text); }

/* ─── MESSAGES ─── */
.messages-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 28px 20px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  position: relative;
}

.messages-wrap::-webkit-scrollbar { width: 4px; }
.messages-wrap::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* Ambient bg */
.messages-wrap::before {
  content: '';
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(91,142,240,0.04) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* Welcome */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: 20px;
  text-align: center;
  padding: 40px 20px;
  position: relative;
  z-index: 1;
}

.welcome-orb {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  box-shadow: 0 0 60px var(--accent-glow);
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.welcome h2 {
  font-size: 1.6rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--text), var(--text-muted));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.welcome p {
  font-size: 0.88rem;
  color: var(--text-muted);
  max-width: 360px;
  line-height: 1.7;
}

.suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  max-width: 500px;
}

.suggestion-chip {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 7px 14px;
  font-size: 0.8rem;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Tajawal', sans-serif;
}

.suggestion-chip:hover {
  background: var(--surface3);
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
}

/* Message rows */
.msg-row {
  display: flex;
  gap: 12px;
  animation: msgIn 0.3s cubic-bezier(.4,0,.2,1) forwards;
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

@keyframes msgIn {
  from { opacity:0; transform: translateY(10px); }
  to { opacity:1; transform: translateY(0); }
}

.msg-row.user { flex-direction: row-reverse; }

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
  align-self: flex-start;
  margin-top: 2px;
}

.avatar.av-user {
  background: linear-gradient(135deg, #2d4fd6, #1a3290);
  font-size: 13px;
  color: #fff;
}

.avatar.av-ai {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 500;
  color: #fff;
  box-shadow: 0 0 16px var(--accent-glow);
}

.bubble-wrap { display: flex; flex-direction: column; max-width: calc(100% - 50px); }

.bubble {
  padding: 13px 16px;
  border-radius: 14px;
  font-size: 0.88rem;
  line-height: 1.75;
  word-break: break-word;
  position: relative;
}

.user .bubble {
  background: var(--user-bubble);
  border: 1px solid rgba(91,142,240,0.15);
  border-radius: 14px 4px 14px 14px;
}

.ai .bubble {
  background: var(--ai-bubble);
  border: 1px solid var(--border2);
  border-radius: 4px 14px 14px 14px;
}

/* File attachment in bubble */
.file-attachment {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 8px;
  font-size: 0.78rem;
  color: var(--text-muted);
}

.file-attachment .file-icon { font-size: 18px; }

.bubble-actions {
  display: flex;
  gap: 4px;
  margin-top: 6px;
  opacity: 0;
  transition: opacity 0.15s;
}

.msg-row:hover .bubble-actions { opacity: 1; }

.bubble-action-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 0.68rem;
  color: var(--text-dim);
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  transition: all 0.15s;
}

.bubble-action-btn:hover { background: var(--surface2); color: var(--text-muted); border-color: var(--border2); }

.bubble-meta {
  font-size: 0.62rem;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  margin-top: 5px;
  padding: 0 2px;
}

.user .bubble-meta { text-align: left; }

/* Typing */
.typing-row { display: flex; gap: 12px; max-width: 860px; width: 100%; margin: 0 auto; }
.typing-dots {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 14px 18px;
  background: var(--ai-bubble);
  border: 1px solid var(--border2);
  border-radius: 4px 14px 14px 14px;
}
.td {
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: td 1.2s infinite;
}
.td:nth-child(2){animation-delay:.2s}
.td:nth-child(3){animation-delay:.4s}
@keyframes td {
  0%,60%,100%{transform:translateY(0);opacity:.3}
  30%{transform:translateY(-6px);opacity:1}
}

/* ─── INPUT AREA ─── */
.input-area {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 14px 20px 16px;
  flex-shrink: 0;
  z-index: 10;
}

/* File preview */
.file-preview-bar {
  display: none;
  align-items: center;
  gap: 8px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 8px 12px;
  margin-bottom: 10px;
  max-width: 860px;
  margin-left: auto;
  margin-right: auto;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.file-preview-bar.show { display: flex; }
.file-preview-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-preview-remove {
  background: none;
  border: none;
  color: var(--red);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  padding: 0 4px;
}

.input-box {
  max-width: 860px;
  margin: 0 auto;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 10px 12px;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.input-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.input-side-btns {
  display: flex;
  gap: 4px;
  align-items: flex-end;
  padding-bottom: 2px;
}

.input-icon-btn {
  width: 32px;
  height: 32px;
  background: none;
  border: none;
  border-radius: 8px;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.15s;
  flex-shrink: 0;
}

.input-icon-btn:hover { background: var(--surface3); color: var(--text-muted); }
.input-icon-btn.recording { color: var(--red); animation: recPulse 1s infinite; }

@keyframes recPulse {
  0%,100%{opacity:1} 50%{opacity:0.4}
}

textarea#msgInput {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-family: 'Tajawal', sans-serif;
  font-size: 0.9rem;
  line-height: 1.6;
  resize: none;
  min-height: 26px;
  max-height: 160px;
  overflow-y: auto;
  direction: rtl;
  padding: 2px 0;
}

textarea#msgInput::placeholder { color: var(--text-dim); }
textarea#msgInput::-webkit-scrollbar { width: 3px; }
textarea#msgInput::-webkit-scrollbar-thumb { background: var(--border2); }

.send-btn {
  width: 38px;
  height: 38px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  flex-shrink: 0;
  transition: all 0.2s;
  box-shadow: 0 3px 14px var(--accent-glow);
}

.send-btn:hover:not(:disabled) { transform: scale(1.06); box-shadow: 0 5px 20px var(--accent-glow); }
.send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }

.input-hint {
  max-width: 860px;
  margin: 6px auto 0;
  font-size: 0.62rem;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  text-align: center;
}

/* ─── TOAST ─── */
.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: rgba(248,113,113,0.1);
  border: 1px solid rgba(248,113,113,0.25);
  color: var(--red);
  padding: 9px 18px;
  border-radius: 10px;
  font-size: 0.78rem;
  font-family: 'JetBrains Mono', monospace;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  z-index: 999;
  white-space: nowrap;
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── OVERLAY ─── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 40;
  backdrop-filter: blur(2px);
}

/* ─── RESPONSIVE ─── */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    transform: translateX(100%);
  }
  .sidebar.open { transform: translateX(0); }
  .overlay { display: block; }
  .overlay.show { display: block; }
  .sidebar-toggle { display: flex; }
  .status-badge span { display: none; }
  .input-area { padding: 10px 12px 14px; }
  .messages-wrap { padding: 16px 12px; }
}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* Hidden file input */
#fileInput { display: none; }
</style>
</head>
<body>

<div class="app">

  <!-- ══════════════════════ SIDEBAR ══════════════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon">GQ</div>
        <div class="brand-name">Groq Chat</div>
      </div>
      <button class="new-chat-btn" onclick="newChat()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        محادثة جديدة
      </button>
    </div>

    <div class="history-section" id="historyList">
      <div class="history-label">المحادثات السابقة</div>
      <!-- filled by JS -->
    </div>

    <div class="sidebar-footer">
      <div class="model-select-label">النموذج</div>
      <select class="model-select" id="modelSelect">
        <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option>
        <option value="llama-3.1-8b-instant">llama-3.1-8b-instant</option>
        <option value="mixtral-8x7b-32768">mixtral-8x7b-32768</option>
        <option value="gemma2-9b-it">gemma2-9b-it</option>
      </select>
    </div>
  </aside>

  <!-- ══════════════════════ MAIN ══════════════════════ -->
  <div class="main">

    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">☰</button>
        <div>
          <div class="chat-title" id="chatTitle">محادثة جديدة</div>
          <div class="chat-subtitle" id="chatSubtitle">groq · llama-3.3-70b</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="status-badge">
          <div class="status-dot"></div>
          <span>متصل</span>
        </div>
        <button class="icon-btn" title="مسح" onclick="clearCurrentChat()">🗑</button>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages-wrap" id="messagesWrap">
      <div class="welcome" id="welcome">
        <div class="welcome-orb">⚡</div>
        <h2>مرحباً بك في Groq Chat</h2>
        <p>اسأل أي شيء وستحصل على إجابة فائقة السرعة مدعومة بـ Groq API</p>
        <div class="suggestions">
          <div class="suggestion-chip" onclick="suggest(this)">ما هو الذكاء الاصطناعي؟</div>
          <div class="suggestion-chip" onclick="suggest(this)">اكتب لي كوداً بلغة Python</div>
          <div class="suggestion-chip" onclick="suggest(this)">ترجم نصاً إلى الإنجليزية</div>
          <div class="suggestion-chip" onclick="suggest(this)">لخّص لي مقالاً</div>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="file-preview-bar" id="filePreviewBar">
        <span>📎</span>
        <span class="file-preview-name" id="filePreviewName"></span>
        <button class="file-preview-remove" onclick="removeFile()">×</button>
      </div>
      <div class="input-box">
        <div class="input-side-btns">
          <button class="input-icon-btn" title="إرفاق ملف" onclick="document.getElementById('fileInput').click()">📎</button>
          <button class="input-icon-btn" id="micBtn" title="الميكروفون" onclick="toggleMic()">🎤</button>
        </div>
        <textarea id="msgInput" placeholder="اكتب رسالتك..." rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M22 2L11 13M22 2L15 22L11 13M11 13L2 9L22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter للإرسال &nbsp;·&nbsp; Shift+Enter لسطر جديد</div>
    </div>
  </div>

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="*/*" onchange="handleFile(event)">

<script>
// ─── STATE ───
const API_URL = 'https://ayb-bh1146-chat-groq.hf.space/api/chat';

let sessions = JSON.parse(localStorage.getItem('gq_sessions') || '[]');
let activeId = null;
let isLoading = false;
let recognition = null;
let isRecording = false;
let pendingFile = null;

// ─── INIT ───
function init() {
  renderHistory();
  if (sessions.length > 0) {
    loadSession(sessions[0].id);
  }
}

// ─── SESSION HELPERS ───
function getSession(id) { return sessions.find(s => s.id === id); }

function saveSession(id, updates) {
  const idx = sessions.findIndex(s => s.id === id);
  if (idx >= 0) Object.assign(sessions[idx], updates);
  localStorage.setItem('gq_sessions', JSON.stringify(sessions));
}

function newChat() {
  const id = 'c_' + Date.now();
  const session = { id, title: 'محادثة جديدة', messages: [], model: 'llama-3.3-70b-versatile', ts: Date.now() };
  sessions.unshift(session);
  localStorage.setItem('gq_sessions', JSON.stringify(sessions));
  loadSession(id);
  renderHistory();
  closeSidebar();
}

function loadSession(id) {
  activeId = id;
  const s = getSession(id);
  if (!s) return;
  document.getElementById('modelSelect').value = s.model || 'llama-3.3-70b-versatile';
  document.getElementById('chatTitle').textContent = s.title;
  document.getElementById('chatSubtitle').textContent = 'groq · ' + (s.model || '').split('-').slice(0,2).join('-');
  renderMessages(s.messages);
  renderHistory();
}

function deleteSession(id, e) {
  e.stopPropagation();
  sessions = sessions.filter(s => s.id !== id);
  localStorage.setItem('gq_sessions', JSON.stringify(sessions));
  if (activeId === id) {
    activeId = null;
    showWelcome();
    document.getElementById('chatTitle').textContent = 'محادثة جديدة';
  }
  renderHistory();
}

function clearCurrentChat() {
  if (!activeId) return;
  saveSession(activeId, { messages: [], title: 'محادثة جديدة' });
  showWelcome();
  document.getElementById('chatTitle').textContent = 'محادثة جديدة';
}

// ─── RENDER HISTORY ───
function renderHistory() {
  const container = document.getElementById('historyList');
  container.innerHTML = '<div class="history-label">المحادثات السابقة</div>';
  if (sessions.length === 0) {
    container.innerHTML += '<div style="padding:12px 10px;font-size:0.78rem;color:var(--text-dim);">لا توجد محادثات بعد</div>';
    return;
  }
  sessions.forEach(s => {
    const div = document.createElement('div');
    div.className = 'history-item' + (s.id === activeId ? ' active' : '');
    div.innerHTML = `
      <span class="history-icon">💬</span>
      <span class="history-text">${escHtml(s.title)}</span>
      <button class="history-del" onclick="deleteSession('${s.id}', event)" title="حذف">×</button>`;
    div.addEventListener('click', () => { loadSession(s.id); closeSidebar(); });
    container.appendChild(div);
  });
}

// ─── RENDER MESSAGES ───
function showWelcome() {
  document.getElementById('messagesWrap').innerHTML = `
    <div class="welcome" id="welcome">
      <div class="welcome-orb">⚡</div>
      <h2>مرحباً بك في Groq Chat</h2>
      <p>اسأل أي شيء وستحصل على إجابة فائقة السرعة مدعومة بـ Groq API</p>
      <div class="suggestions">
        <div class="suggestion-chip" onclick="suggest(this)">ما هو الذكاء الاصطناعي؟</div>
        <div class="suggestion-chip" onclick="suggest(this)">اكتب لي كوداً بلغة Python</div>
        <div class="suggestion-chip" onclick="suggest(this)">ترجم نصاً إلى الإنجليزية</div>
        <div class="suggestion-chip" onclick="suggest(this)">لخّص لي مقالاً</div>
      </div>
    </div>`;
}

function renderMessages(messages) {
  const wrap = document.getElementById('messagesWrap');
  if (!messages || messages.length === 0) { showWelcome(); return; }
  wrap.innerHTML = '';
  messages.forEach(m => appendBubble(m.role, m.content, m.file, false));
  wrap.scrollTop = wrap.scrollHeight;
}

function appendBubble(role, text, file, animate = true) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const wrap = document.getElementById('messagesWrap');
  const isUser = role === 'user';
  const time = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
  const model = document.getElementById('modelSelect').value.split('-').slice(0,2).join('-');

  const row = document.createElement('div');
  row.className = 'msg-row ' + (isUser ? 'user' : 'ai');
  if (!animate) row.style.animation = 'none';

  const fileHtml = file ? `<div class="file-attachment"><span class="file-icon">📎</span><span>${escHtml(file)}</span></div>` : '';

  row.innerHTML = `
    <div class="avatar ${isUser ? 'av-user' : 'av-ai'}">${isUser ? '👤' : 'GQ'}</div>
    <div class="bubble-wrap">
      <div class="bubble">
        ${fileHtml}
        <div>${escHtml(text).replace(/\n/g,'<br>')}</div>
      </div>
      <div class="bubble-actions">
        <button class="bubble-action-btn" onclick="copyText(this)">نسخ</button>
      </div>
      <div class="bubble-meta">${time}${isUser ? '' : ' · ' + model}</div>
    </div>`;
  wrap.appendChild(row);
  wrap.scrollTop = wrap.scrollHeight;
}

function addTyping() {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();
  const wrap = document.getElementById('messagesWrap');
  const div = document.createElement('div');
  div.className = 'typing-row';
  div.id = 'typing';
  div.innerHTML = `
    <div class="avatar av-ai">GQ</div>
    <div class="typing-dots"><div class="td"></div><div class="td"></div><div class="td"></div></div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

// ─── SEND ───
async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text && !pendingFile) return;

  if (!activeId) newChat();

  const session = getSession(activeId);
  const model = document.getElementById('modelSelect').value;
  const file = pendingFile ? pendingFile.name : null;

  input.value = '';
  input.style.height = 'auto';
  removeFile();
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  const userMsg = { role: 'user', content: text || '[ملف مرفق]', file };
  session.messages.push(userMsg);

  if (session.messages.length === 1) {
    const title = (text || file || 'محادثة').substring(0, 30);
    session.title = title;
    document.getElementById('chatTitle').textContent = title;
  }

  appendBubble('user', text || '[ملف مرفق]', file);
  addTyping();

  try {
    const apiMessages = session.messages.map(m => ({ role: m.role, content: m.content }));
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: apiMessages, model })
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    removeTyping();
    const aiMsg = { role: 'assistant', content: data.reply };
    session.messages.push(aiMsg);
    saveSession(activeId, { messages: session.messages, title: session.title, model });
    renderHistory();
    appendBubble('assistant', data.reply);

  } catch (err) {
    removeTyping();
    session.messages.pop();
    showToast('⚠ خطأ في الاتصال: ' + err.message);
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

// ─── FILE ───
function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  pendingFile = file;
  document.getElementById('filePreviewName').textContent = file.name;
  document.getElementById('filePreviewBar').classList.add('show');
  e.target.value = '';
}

function removeFile() {
  pendingFile = null;
  document.getElementById('filePreviewBar').classList.remove('show');
  document.getElementById('filePreviewName').textContent = '';
}

// ─── MICROPHONE ───
function toggleMic() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showToast('المتصفح لا يدعم الميكروفون'); return;
  }
  if (isRecording) {
    recognition && recognition.stop();
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'ar-SA';
  recognition.interimResults = false;
  recognition.onresult = e => {
    const transcript = e.results[0][0].transcript;
    const input = document.getElementById('msgInput');
    input.value += transcript;
    autoResize(input);
  };
  recognition.onend = () => {
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
  };
  recognition.onerror = () => {
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
    showToast('تعذّر الوصول إلى الميكروفون');
  };
  recognition.start();
  isRecording = true;
  document.getElementById('micBtn').classList.add('recording');
}

// ─── UTILS ───
function suggest(el) {
  const input = document.getElementById('msgInput');
  input.value = el.textContent;
  autoResize(input);
  input.focus();
}

function copyText(btn) {
  const bubble = btn.closest('.bubble-wrap').querySelector('.bubble div:last-child');
  navigator.clipboard.writeText(bubble.innerText).then(() => showToast('✓ تم النسخ'));
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Model change
document.getElementById('modelSelect').addEventListener('change', function() {
  if (activeId) saveSession(activeId, { model: this.value });
  document.getElementById('chatSubtitle').textContent = 'groq · ' + this.value.split('-').slice(0,2).join('-');
});

// Sidebar
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

init();
</script>
</body>
</html>
