<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groq Chat</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10;
    --surface: #0d1117;
    --surface2: #161b22;
    --surface3: #21262d;
    --border: #30363d;
    --accent: #00d4aa;
    --accent2: #58a6ff;
    --accent3: #f78166;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --text-dim: #484f58;
    --glow: 0 0 20px rgba(0,212,170,0.15);
    --user-bg: #1c2d3a;
    --ai-bg: #0d1117;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,170,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,170,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  .header {
    position: relative;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    backdrop-filter: blur(10px);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    color: #000;
    letter-spacing: -1px;
  }

  .header-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.5px;
  }

  .header-sub {
    font-size: 0.7rem;
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 1px;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,212,170,0.08);
    border: 1px solid rgba(0,212,170,0.2);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 0.72rem;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--accent);
  }

  .status-dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  /* Model selector */
  .model-bar {
    position: relative;
    z-index: 10;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 8px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    overflow-x: auto;
  }

  .model-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    white-space: nowrap;
  }

  .model-chip {
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 0.72rem;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .model-chip:hover { border-color: var(--accent); color: var(--accent); }
  .model-chip.active {
    background: rgba(0,212,170,0.1);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Messages area */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
    z-index: 1;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Welcome screen */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 16px;
    opacity: 0.6;
    text-align: center;
  }

  .welcome-icon {
    width: 64px;
    height: 64px;
    border: 1px solid var(--border);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    background: var(--surface2);
  }

  .welcome h2 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-muted);
  }

  .welcome p {
    font-size: 0.82rem;
    color: var(--text-dim);
    max-width: 280px;
    line-height: 1.6;
  }

  /* Message bubbles */
  .message {
    display: flex;
    gap: 12px;
    animation: fadeUp 0.3s ease forwards;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .avatar.user-av {
    background: linear-gradient(135deg, var(--accent2), #1a6b9c);
    color: white;
  }

  .avatar.ai-av {
    background: linear-gradient(135deg, var(--accent), #007a5e);
    color: #000;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
  }

  .bubble {
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 0.88rem;
    line-height: 1.7;
    max-width: calc(100% - 50px);
    position: relative;
    word-break: break-word;
  }

  .user .bubble {
    background: var(--user-bg);
    border: 1px solid rgba(88,166,255,0.15);
    border-radius: 12px 2px 12px 12px;
    color: var(--text);
  }

  .ai .bubble {
    background: var(--ai-bg);
    border: 1px solid var(--border);
    border-radius: 2px 12px 12px 12px;
    color: var(--text);
  }

  .bubble-meta {
    font-size: 0.65rem;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 6px;
  }

  /* Typing indicator */
  .typing-bubble {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 14px 18px;
  }

  .typing-dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: typing 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Input area */
  .input-area {
    position: relative;
    z-index: 10;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 16px 24px;
  }

  .input-wrapper {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    transition: border-color 0.2s;
  }

  .input-wrapper:focus-within {
    border-color: var(--accent);
    box-shadow: var(--glow);
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 0.88rem;
    line-height: 1.6;
    resize: none;
    max-height: 140px;
    min-height: 24px;
    overflow-y: auto;
    direction: rtl;
  }

  textarea::placeholder { color: var(--text-dim); }

  textarea::-webkit-scrollbar { width: 3px; }
  textarea::-webkit-scrollbar-thumb { background: var(--border); }

  .send-btn {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent), #009e80);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    color: #000;
  }

  .send-btn:hover { transform: scale(1.05); box-shadow: 0 0 14px rgba(0,212,170,0.4); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .send-btn svg { width: 16px; height: 16px; }

  .input-hint {
    max-width: 820px;
    margin: 6px auto 0;
    font-size: 0.65rem;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    text-align: center;
  }

  /* Clear button */
  .clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 0.7rem;
    color: var(--text-dim);
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    transition: all 0.2s;
  }
  .clear-btn:hover { border-color: var(--accent3); color: var(--accent3); }

  /* Error toast */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(247,129,102,0.1);
    border: 1px solid rgba(247,129,102,0.3);
    color: var(--accent3);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.8rem;
    opacity: 0;
    transition: all 0.3s;
    z-index: 100;
    font-family: 'IBM Plex Mono', monospace;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Responsive */
  @media (max-width: 600px) {
    .messages { padding: 16px; }
    .input-area { padding: 12px 16px; }
    .model-bar { padding: 8px 16px; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="logo">GQ</div>
    <div>
      <div class="header-title">Groq Chat</div>
      <div class="header-sub">powered by groq api</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button class="clear-btn" onclick="clearChat()">مسح المحادثة</button>
    <div class="status-pill">
      <div class="status-dot"></div>
      متصل
    </div>
  </div>
</div>

<!-- Model selector -->
<div class="model-bar">
  <span class="model-label">model //</span>
  <button class="model-chip active" data-model="llama-3.3-70b-versatile">llama-3.3-70b</button>
  <button class="model-chip" data-model="llama-3.1-8b-instant">llama-3.1-8b</button>
  <button class="model-chip" data-model="mixtral-8x7b-32768">mixtral-8x7b</button>
  <button class="model-chip" data-model="gemma2-9b-it">gemma2-9b</button>
</div>

<!-- Messages -->
<div class="messages" id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">⚡</div>
    <h2>مرحباً بك في Groq Chat</h2>
    <p>اسأل أي شيء وستحصل على إجابة فائقة السرعة</p>
  </div>
</div>

<!-- Input -->
<div class="input-area">
  <div class="input-wrapper">
    <textarea
      id="input"
      placeholder="اكتب رسالتك هنا..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M22 2L11 13M22 2L15 22L11 13M11 13L2 9L22 2"/>
      </svg>
    </button>
  </div>
  <div class="input-hint">Enter للإرسال &nbsp;·&nbsp; Shift+Enter لسطر جديد</div>
</div>

<div class="toast" id="toast"></div>

<script>
  let history = [];
  let currentModel = 'llama-3.3-70b-versatile';
  let isLoading = false;

  // Model selection
  document.querySelectorAll('.model-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.model-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentModel = btn.dataset.model;
    });
  });

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  function clearChat() {
    history = [];
    const msgs = document.getElementById('messages');
    msgs.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-icon">⚡</div>
        <h2>مرحباً بك في Groq Chat</h2>
        <p>اسأل أي شيء وستحصل على إجابة فائقة السرعة</p>
      </div>`;
  }

  function addMessage(role, text) {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    const msgs = document.getElementById('messages');
    const isUser = role === 'user';
    const time = new Date().toLocaleTimeString('ar-SA', {hour:'2-digit', minute:'2-digit'});

    const div = document.createElement('div');
    div.className = `message ${isUser ? 'user' : 'ai'}`;
    div.innerHTML = `
      <div class="avatar ${isUser ? 'user-av' : 'ai-av'}">${isUser ? '👤' : 'GQ'}</div>
      <div class="bubble">
        ${escapeHtml(text).replace(/\n/g, '<br>')}
        <div class="bubble-meta">${time} · ${currentModel}</div>
      </div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  function addTyping() {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'message ai';
    div.id = 'typing';
    div.innerHTML = `
      <div class="avatar ai-av">GQ</div>
      <div class="bubble typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  async function sendMessage() {
    if (isLoading) return;
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    isLoading = true;
    document.getElementById('sendBtn').disabled = true;

    history.push({ role: 'user', content: text });
    addMessage('user', text);
    addTyping();

    try {
      const res = await fetch('https://ayb-bh1146-chat-groq.hf.space/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history, model: currentModel })
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      removeTyping();
      history.push({ role: 'assistant', content: data.reply });
      addMessage('assistant', data.reply);

    } catch (err) {
      removeTyping();
      showToast('⚠ خطأ في الاتصال: ' + err.message);
      history.pop();
    }

    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('input').focus();
  }
</script>
</body>
</html>
